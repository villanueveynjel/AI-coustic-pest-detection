    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="theme-color" content="#214f3c">
      <title>Forgot Password | AI-coustic Rice Field Monitoring</title>
      <link rel="stylesheet" href="../static/style.css">
    </head>
    <body>
      <main class="screen recovery-page">
        <header class="brand">AI-coustic<strong>Rice Field Monitoring</strong></header>
        <section class="recovery-content forgot-content">
          <a class="recovery-back" href="login.html"><svg viewBox="0 0 16 20" aria-hidden="true"><path d="m11.5 3-6 7 6 7"/></svg>Back</a>
          <div class="recovery-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="27" width="48" height="30" rx="6"/><path d="M20 27v-8a12 12 0 0 1 24 0v8M23 42h.1M32 42h.1M41 42h.1"/></svg></div>
          <h1>Forgot Password?</h1>
          <p class="recovery-description">Enter your email address and we’ll send<br>a secure password reset link to it.</p>
          <form id="forgot-password-form" class="recovery-form" novalidate>
            <div class="input-wrap recovery-input-wrap">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.8" y="5" width="18.4" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <input id="recovery-email" type="email" autocomplete="email" placeholder="Enter your email" aria-label="Email address" required>
            </div>
            <div class="recovery-notice"><span aria-hidden="true">!</span><p>Open the link in your email to verify ownership and choose a new password. Check your inbox or spam folder.</p></div>
            <p class="recovery-status" role="status" aria-live="polite" hidden></p>
            <button class="primary" type="submit">Send Reset Link</button>
          </form>
        </section>
        <div class="footer-stripe"></div><div class="footer-block"></div>
      </main>
      <script type="module" src="../static/app.js"></script>
  <script type="module" src="../static/firebase-backend.js"></script>
    </body>
    </html>
