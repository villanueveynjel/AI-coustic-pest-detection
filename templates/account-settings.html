<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#214f3c"><title>Account Settings | AI-coustic</title><link rel="stylesheet" href="../static/style.css"></head>
<body class="dashboard-body"><main class="screen settings-page">
  <header class="brand dashboard-brand"><span>AI-coustic<strong>Rice Field Monitoring</strong></span><button class="notification-button" type="button" aria-label="Open notifications" aria-expanded="false" aria-controls="notification-menu">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M25 12a9 9 0 0 0-18 0c0 10-4 10-4 13h26c0-3-4-3-4-13ZM13 29h6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span class="notification-dot" aria-hidden="true" hidden></span>
</button>
<div class="notification-menu" id="notification-menu" hidden>
  <div class="notification-menu-heading"><strong>Notifications</strong><div class="notification-menu-actions"><button type="button" class="notification-clear">Mark all read</button><button type="button" class="notification-clear-all">Clear all</button></div></div>
  <p class="notification-read-state" hidden>You’re all caught up.</p>
</div><button class="profile-button" type="button" aria-label="Open account menu" aria-expanded="false" aria-controls="profile-menu"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#d5e2ce"/><circle cx="24" cy="18" r="7" fill="#214f3c"/><path d="M10 38c1.5-7 6.8-10.5 14-10.5S36.5 31 38 38" fill="#214f3c"/></svg><span class="profile-check" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#204d3a" stroke="#f0f5ee" stroke-width="2.5"/><path d="m7.5 9.5 4.5 5 4.5-5" fill="none" stroke="#f0f5ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button><div class="profile-menu" id="profile-menu" hidden><a data-account-link href="./account-settings.html"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3"/><path d="M2 15c.3-3.2 2.4-5 6-5s5.7 1.8 6 5H2Z"/></svg>Account</a><a href="login.html">⇥ &nbsp;Log out</a></div></header>
  <section class="settings-scroll"><div class="detail-content">
    <div class="page-topline"><a class="back-to-settings" href="settings.html">‹ &nbsp;Back</a><strong>Account Settings</strong></div>
    <div class="account-hero"><span class="large-setting-icon"><svg viewBox="0 0 32 32"><circle cx="16" cy="10" r="6"/><path d="M4 29c1-7 5-11 12-11s11 4 12 11H4Z"/></svg></span><div><h1>Account User</h1><small></small></div></div>
    <section class="accordion-card">
      <button class="accordion-toggle" type="button" aria-expanded="true" aria-controls="account-details-panel"><span>Account Details</span><svg viewBox="0 0 20 20"><path d="m3 12 7-7 7 7"/></svg></button>
      <div class="accordion-panel" id="account-details-panel">
        <label class="compact-field">Full Name<input name="full-name" value="" readonly></label>
        <label class="compact-field">Email Address<input name="email" type="email" value="" readonly></label>
        <label class="compact-field">Contact Number<input name="phone" type="tel" value="" readonly></label>
        <div class="form-actions"><button class="small-primary edit-profile" type="button">✎ &nbsp;Edit Profile</button></div>
      </div>
    </section>
    <section class="accordion-card">
      <button class="accordion-toggle" type="button" aria-expanded="true" aria-controls="password-panel"><span>Change Password</span><svg viewBox="0 0 20 20"><path d="m3 12 7-7 7 7"/></svg></button>
      <form class="accordion-panel password-form" id="password-panel">
        <p class="password-reset-explainer">We’ll email a secure verification link to <strong data-password-reset-email>your account email</strong>. Open it to choose a new password.</p>
        <button class="small-primary" type="submit">Email Verification Link</button>
      </form>
    </section>
    <section class="accordion-card">
      <button class="accordion-toggle" type="button" aria-expanded="true" aria-controls="notifications-panel"><span>Notifications</span><svg viewBox="0 0 20 20"><path d="m3 12 7-7 7 7"/></svg></button>
      <div class="accordion-panel notification-panel" id="notifications-panel">
        <label class="notification-setting"><span><strong>Detection Alerts</strong><small>Notify me when a pest is detected</small></span><input type="checkbox" checked data-persist="notify-detection" aria-label="Detection alerts"></label>
        <label class="notification-setting"><span><strong>System Alerts</strong><small>Battery, Wi-Fi, and device alerts</small></span><input type="checkbox" checked data-persist="notify-system" aria-label="System alerts"></label>
        <label class="notification-setting"><span><strong>Firmware Updates</strong><small>Notify me about available updates</small></span><input type="checkbox" checked data-persist="notify-firmware" aria-label="Firmware update alerts"></label>
      </div>
    </section>
    <p class="settings-toast" role="status" aria-live="polite" hidden></p>
  </div></section>
  <nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item" href="dashboard.html"><svg viewBox="0 0 28 28"><path d="m3 12 11-9 11 9v13H17v-8h-6v8H3V12Z"/></svg><span>Home</span></a><a class="nav-item" href="history.html"><svg viewBox="0 0 28 28"><path d="M5 3h18v22H5zM5 9h18M5 16h18"/></svg><span>History</span></a><a class="nav-item selected" href="settings.html"><svg viewBox="0 0 28 28"><path d="m11 2 6 0 1 3 3 2 3-.5 2 5-2.5 2v3L26 19l-2 5-3-.5-3 2-1 2-6 0-1-3-3-2-3 .5-2-5 2.5-2v-3L2 11l2-5 3 .5 3-2 1-2Z"/><circle cx="14" cy="14" r="4"/></svg><span>Settings</span></a></nav>
</main><script type="module" src="../static/app.js"></script>
  <script type="module" src="../static/firebase-backend.js"></script></body></html>
