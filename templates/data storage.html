<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#214f3c"><title>Data Storage | AI-coustic</title><link rel="stylesheet" href="../static/style.css"></head>
<body class="dashboard-body"><main class="screen settings-page">
  <header class="brand dashboard-brand"><span>AI-coustic<strong>Rice Field Monitoring</strong></span><button class="notification-button" type="button" aria-label="Open notifications" aria-expanded="false" aria-controls="notification-menu">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M25 12a9 9 0 0 0-18 0c0 10-4 10-4 13h26c0-3-4-3-4-13ZM13 29h6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span class="notification-dot" aria-hidden="true" hidden></span>
</button>
<div class="notification-menu" id="notification-menu" hidden>
  <div class="notification-menu-heading"><strong>Notifications</strong><div class="notification-menu-actions"><button type="button" class="notification-clear">Mark all read</button><button type="button" class="notification-clear-all">Clear all</button></div></div>
  <p class="notification-read-state" hidden>You’re all caught up.</p>
</div><button class="profile-button" type="button" aria-label="Open account menu" aria-expanded="false" aria-controls="profile-menu"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#d5e2ce"/><circle cx="24" cy="18" r="7" fill="#214f3c"/><path d="M10 38c1.5-7 6.8-10.5 14-10.5S36.5 31 38 38" fill="#214f3c"/></svg><span class="profile-check"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#204d3a" stroke="#f0f5ee" stroke-width="2.5"/><path d="m7.5 9.5 4.5 5 4.5-5" fill="none" stroke="#f0f5ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button><div class="profile-menu" id="profile-menu" hidden><a data-account-link href="./account-settings.html">Account</a><a href="login.html">Log out</a></div></header>
  <section class="settings-scroll"><div class="detail-content">
    <div class="page-topline"><a class="back-to-settings" href="settings.html">‹ &nbsp;Back</a></div>
    <div class="detail-title"><span class="large-setting-icon storage-icon"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="7" rx="11" ry="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 7v18c0 2 5 4 11 4s11-2 11-4V7M5 13c0 2 5 4 11 4s11-2 11-4M5 19c0 2 5 4 11 4s11-2 11-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><div><h1>Data Storage</h1><p>Detection history and system data</p></div></div>
    <section class="storage-card">
      <div class="storage-summary"><span>Storage allocation</span><strong><span id="storage-used">3.2</span> GB / 16 GB</strong></div>
      <div class="storage-track"><span id="storage-bar" style="width:20%"></span></div>
      <p class="storage-percent"><span id="storage-percent">20</span>% used <i></i> <span id="storage-available">12.8</span> GB available</p>
      <div class="storage-breakdown"><div><span>Detection Records</span><strong id="records-size">2.8 GB</strong></div><div><span>System Data</span><strong id="system-size">0.4 GB</strong></div></div>
    </section>
    <section class="storage-actions"><h2>Storage Optimization</h2><div class="storage-action-list">
      <button type="button" data-storage-action="sync">Sync Cloud</button>
      <button type="button" data-storage-action="clear-storage">Clear Storage</button>
      <button type="button" data-storage-action="clear-cache">Clear Cache</button>
    </div></section>
    <p class="settings-toast" role="status" aria-live="polite" hidden></p>
  </div></section>
  <nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item" href="dashboard.html"><svg viewBox="0 0 28 28"><path d="m3 12 11-9 11 9v13H17v-8h-6v8H3V12Z"/></svg><span>Home</span></a><a class="nav-item" href="history.html"><svg viewBox="0 0 28 28"><path d="M5 3h18v22H5zM5 9h18M5 16h18"/></svg><span>History</span></a><a class="nav-item selected" href="settings.html"><svg viewBox="0 0 28 28"><path d="m11 2 6 0 1 3 3 2 3-.5 2 5-2.5 2v3L26 19l-2 5-3-.5-3 2-1 2-6 0-1-3-3-2-3 .5-2-5 2.5-2v-3L2 11l2-5 3 .5 3-2 1-2Z"/><circle cx="14" cy="14" r="4"/></svg><span>Settings</span></a></nav>
</main><script type="module" src="../static/app.js"></script>
  <script type="module" src="../static/firebase-backend.js"></script></body></html>
