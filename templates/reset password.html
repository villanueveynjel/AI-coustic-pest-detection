<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#214f3c">
  <title>Reset Your Password | AI-coustic Rice Field Monitoring</title>
  <link rel="stylesheet" href="../static/style.css">
</head>
<body>
  <main class="screen recovery-page">
    <header class="brand">AI-coustic<strong>Rice Field Monitoring</strong></header>
    <section class="recovery-content reset-content">
      <a class="recovery-back" href="verify%20email.html"><svg viewBox="0 0 16 20" aria-hidden="true"><path d="m11.5 3-6 7 6 7"/></svg>Back</a>
      <div class="recovery-icon reset-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="27" width="48" height="30" rx="6"/><path d="M20 27v-8a12 12 0 0 1 24 0v8M23 42h.1M32 42h.1M41 42h.1"/></svg></div>
      <h1>Reset Your Password</h1>
      <p class="recovery-description">Enter your new password below.</p>
      <form id="reset-password-form" class="recovery-form reset-form" novalidate>
        <label class="recovery-label" for="new-password">Password</label>
        <div class="input-wrap recovery-input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="10" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 10V7a5 5 0 0 1 10 0v3M8 15h.01M12 15h.01M16 15h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input id="new-password" type="password" autocomplete="new-password" placeholder="Enter your password" required>
          <button class="toggle-password" type="button" aria-label="Show password" aria-controls="new-password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.6"/></svg></button>
        </div>
        <label class="recovery-label" for="confirm-new-password">Confirm Password</label>
        <div class="input-wrap recovery-input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="10" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 10V7a5 5 0 0 1 10 0v3M8 15h.01M12 15h.01M16 15h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input id="confirm-new-password" type="password" autocomplete="new-password" placeholder="Confirm your password" required>
          <button class="toggle-password" type="button" aria-label="Show password" aria-controls="confirm-new-password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.6"/></svg></button>
        </div>
        <label class="reset-terms"><input id="reset-terms" type="checkbox" required> Terms and Conditions</label>
        <div class="password-requirements"><strong>Password Requirements:</strong><span>✓ &nbsp;At least 8 characters</span><span>✓ &nbsp;Include at least one letter</span><span>✓ &nbsp;Include at least one number</span><span>✓ &nbsp;Include at least one special character (e.g. ! @ # $ %)</span></div>
        <p class="recovery-status" role="status" aria-live="polite" hidden></p>
        <button class="primary" type="submit">Reset Password</button>
      </form>
    </section>
    <div class="footer-stripe"></div><div class="footer-block"></div>
  </main>
  <script type="module" src="../static/app.js"></script>
  <script type="module" src="../static/firebase-backend.js"></script>
</body>
</html>
