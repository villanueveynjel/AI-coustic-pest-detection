<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#214f3c">
  <title>Sign up | AI-coustic Rice Field Monitoring</title>
  <link rel="stylesheet" href="../static/style.css">
</head>
<body>
  <main class="screen signup">
    <header class="brand">AI-coustic<strong>Rice Field Monitoring</strong></header>
    <section class="content">
      <h1>Welcome to AI-coustic!</h1>
      <p class="intro">Sign up to monitor your rice field and<br>manage your AI-coustic system</p>
      <form id="signup-form" data-demo-form novalidate>
        <div class="field">
          <label for="name">Name</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M3 21c0-4.1 3.6-7 9-7s9 2.9 9 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your name" required>
          </div>
        </div>
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.8" y="5" width="18.4" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required>
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="10" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 10V7a5 5 0 0 1 10 0v3M8 15h.01M12 15h.01M16 15h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Enter your password" required>
            <button class="toggle-password" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.6"/></svg></button>
          </div>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="10" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 10V7a5 5 0 0 1 10 0v3M8 15h.01M12 15h.01M16 15h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Confirm your password" required>
            <button class="toggle-password" type="button" aria-label="Show password" aria-controls="confirm-password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.6"/></svg></button>
          </div>
        </div>
        <label class="terms"><input type="checkbox" name="terms" required> <span>I agree to the <a href="#terms">Terms and Conditions</a></span></label>
        <button class="primary" type="submit">Sign up</button>
        <p class="status" role="status" aria-live="polite"></p>
        <a class="back-link" href="login.html"><svg viewBox="0 0 16 20" fill="none" aria-hidden="true"><path d="m11.5 3-6 7 6 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to log in</a>
      </form>
    </section>
    <div class="footer-stripe"></div><div class="footer-block"></div>
  </main>
  <script type="module" src="../static/app.js"></script>
  <script type="module" src="../static/firebase-backend.js"></script>
</body>
</html>
