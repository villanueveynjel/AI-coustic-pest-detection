<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#214f3c">
  <title>Log in | AI-coustic Rice Field Monitoring</title>
  <link rel="stylesheet" href="../static/style.css">
</head>
<body>
  <main class="screen login">
    <header class="brand">AI-coustic<strong>Rice Field Monitoring</strong></header>
    <section class="content">
      <h1>Welcome to AI-coustic!</h1>
      <p class="intro">Log in to monitor your rice field and<br>manage your AI-coustic system</p>
      <form id="login-form" data-demo-form novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.8" y="5" width="18.4" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required>
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="10" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 10V7a5 5 0 0 1 10 0v3M8 15h.01M12 15h.01M16 15h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="toggle-password" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.6"/></svg></button>
          </div>
        </div>
        <div class="options">
          <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
          <a class="forgot" href="forgot%20password.html">Forgot Password?</a>
        </div>
        <button class="primary" type="submit">Log in</button>
        <p class="status" role="status" aria-live="polite"></p>
        <div class="divider">or use your Google Account</div>
        <button class="google" type="button" data-google aria-label="Continue with Google">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.7-3.6-11.3-8.4H5.9v5.2A20.4 20.4 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.7 27.7a12.3 12.3 0 0 1 0-7.4v-5.2H5.9a20.4 20.4 0 0 0 0 17.8l6.8-5.2Z"/><path fill="#EA4335" d="M24 11.9c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 5.8 29.5 4 24 4A20.4 20.4 0 0 0 5.9 15.1l6.8 5.2c1.6-4.8 6-8.4 11.3-8.4Z"/></svg>
        </button>
      </form>
    </section>
    <p class="bottom-prompt">Don’t have an account? <a href="signup.html">Create one</a></p>
    <div class="footer-stripe"></div><div class="footer-block"></div>
  </main>
  <script type="module" src="../static/app.js"></script>
  <script type="module" src="../static/firebase-backend.js"></script>
</body>
</html>
